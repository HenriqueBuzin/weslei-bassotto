name: weslei-bassotto-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-labels: &default-labels
  infra.project: weslei-bassotto
  infra.environment: development
  infra.version: ${IMAGE_TAG:-local}

services:
  backend:
    image: weslei-bassotto/backend:${IMAGE_TAG:-local}-dev
    labels: *default-labels
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    build:
      context: ./api
      target: dev
      args:
        API_PORT: ${API_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=${APP_ENV}
      - APP_URL=${APP_URL}
      - API_BASE=${API_BASE}
      - API_PORT=${API_PORT}
      - JWT_ALG=${JWT_ALG}
      - ACCESS_TOKEN_EXPIRES_MINUTES=${ACCESS_TOKEN_EXPIRES_MINUTES}
      - REFRESH_TOKEN_EXPIRES_SHORT_HOURS=${REFRESH_TOKEN_EXPIRES_SHORT_HOURS}
      - REFRESH_TOKEN_EXPIRES_LONG_DAYS=${REFRESH_TOKEN_EXPIRES_LONG_DAYS}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS}
      - LOGIN_ATTEMPT_WINDOW_MINUTES=${LOGIN_ATTEMPT_WINDOW_MINUTES}
      - LOGIN_LOCK_MINUTES=${LOGIN_LOCK_MINUTES}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH}
      - SEED_ON_START=${SEED_ON_START}
      - PAYMENT_GATEWAY_ORDER=${PAYMENT_GATEWAY_ORDER}
      - PASSWORD_RESET_EXPIRES_MINUTES=${PASSWORD_RESET_EXPIRES_MINUTES}
      - MAIL_MAILER=smtp
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - SMTP_USE_SSL=${SMTP_USE_SSL}
      - SMTP_USER=${SMTP_USER}
      - SMTP_FROM=${SMTP_FROM}
      - APP_KEY_FILE=/run/secrets/app_key
      - DATABASE_URL_FILE=/run/secrets/database_url
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - MERCADO_PAGO_ACCESS_TOKEN_FILE=/run/secrets/mercado_pago_access_token
      - MERCADO_PAGO_WEBHOOK_SECRET_FILE=/run/secrets/mercado_pago_webhook_secret
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - TZ=America/Sao_Paulo
    secrets:
      - app_key
      - database_url
      - jwt_secret
      - mercado_pago_access_token
      - mercado_pago_webhook_secret
      - smtp_password
    ulimits:
      core:
        soft: 0
        hard: 0
    volumes:
      - ./api:/app
      # Keeps the container's Linux vendor tree out of the host's, which the
      # bind mount would otherwise shadow.
      - api_vendor:/app/vendor
    healthcheck:
      # Deliberately free of dollar signs: compose would read them as its own
      # variables and blank them out before the shell ever sees them.
      test:
        - CMD
        - php
        - -r
        - 'exit((@json_decode(@file_get_contents("http://127.0.0.1:" . getenv("API_PORT") . "/health"), true)["status"] ?? "") === "ok" ? 0 : 1);'
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    networks:
      - proxy-network
      - postgres-network


  # routes/console.php agenda platform:prune, e sem este processo o
  # agendamento nunca dispara: o backend sobe apenas o servidor HTTP/FPM.
  scheduler:
    image: weslei-bassotto/scheduler:${IMAGE_TAG:-local}-dev
    labels: *default-labels
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    build:
      context: ./api
      target: dev-scheduler
      args:
        API_PORT: ${API_PORT}
    # O vendor vem do volume compartilhado, que o backend popula: subir antes
    # dele deixaria este container sem dependências.
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=${APP_ENV}
      - APP_URL=${APP_URL}
      - API_BASE=${API_BASE}
      - API_PORT=${API_PORT}
      - JWT_ALG=${JWT_ALG}
      - ACCESS_TOKEN_EXPIRES_MINUTES=${ACCESS_TOKEN_EXPIRES_MINUTES}
      - REFRESH_TOKEN_EXPIRES_SHORT_HOURS=${REFRESH_TOKEN_EXPIRES_SHORT_HOURS}
      - REFRESH_TOKEN_EXPIRES_LONG_DAYS=${REFRESH_TOKEN_EXPIRES_LONG_DAYS}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS}
      - LOGIN_ATTEMPT_WINDOW_MINUTES=${LOGIN_ATTEMPT_WINDOW_MINUTES}
      - LOGIN_LOCK_MINUTES=${LOGIN_LOCK_MINUTES}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH}
      - SEED_ON_START=${SEED_ON_START}
      - PAYMENT_GATEWAY_ORDER=${PAYMENT_GATEWAY_ORDER}
      - PASSWORD_RESET_EXPIRES_MINUTES=${PASSWORD_RESET_EXPIRES_MINUTES}
      - MAIL_MAILER=smtp
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - SMTP_USE_SSL=${SMTP_USE_SSL}
      - SMTP_USER=${SMTP_USER}
      - SMTP_FROM=${SMTP_FROM}
      - APP_KEY_FILE=/run/secrets/app_key
      - DATABASE_URL_FILE=/run/secrets/database_url
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - MERCADO_PAGO_ACCESS_TOKEN_FILE=/run/secrets/mercado_pago_access_token
      - MERCADO_PAGO_WEBHOOK_SECRET_FILE=/run/secrets/mercado_pago_webhook_secret
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - TZ=America/Sao_Paulo
    secrets:
      - app_key
      - database_url
      - jwt_secret
      - mercado_pago_access_token
      - mercado_pago_webhook_secret
      - smtp_password
    ulimits:
      core:
        soft: 0
        hard: 0
    volumes:
      - ./api:/app
      # Keeps the container's Linux vendor tree out of the host's, which the
      # bind mount would otherwise shadow.
      - api_vendor:/app/vendor
    healthcheck:
      test: ["CMD", "php", "artisan", "platform:health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - postgres-network

  frontend:
    image: weslei-bassotto/frontend:${IMAGE_TAG:-local}-dev
    labels: *default-labels
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_PORT=${VITE_PORT}
    environment:
      - VITE_API_BASE=${API_BASE}
      - VITE_PORT=${VITE_PORT}
      - VITE_APP_NAME=${VITE_APP_NAME}
      - VITE_MP_PUBLIC_KEY=${VITE_MP_PUBLIC_KEY}
      - VITE_WHATSAPP_NUMBER=${VITE_WHATSAPP_NUMBER}
      - VITE_PROXY_TARGET=http://backend:${API_PORT}
      - VITE_HMR_DISABLED=${VITE_HMR_DISABLED}
      - VITE_HMR_HOST=${VITE_HMR_HOST}
      - VITE_HMR_PROTOCOL=${VITE_HMR_PROTOCOL}
      - VITE_HMR_CLIENT_PORT=${VITE_HMR_CLIENT_PORT}
      - VITE_HMR_PATH=${VITE_HMR_PATH}
      - TZ=America/Sao_Paulo
    volumes:
      - ./frontend:/app
      - react_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - |
          : "$${VITE_PORT:?VITE_PORT nao definido}";
          node -e "
          const http=require('http'), p=Number(process.env.VITE_PORT);
          const ping=path=>new Promise(ok=>{
            const r=http.get({host:'127.0.0.1',port:p,path},s=>ok(s.statusCode===200));
            r.on('error',()=>ok(false)); setTimeout(()=>{try{r.destroy()}catch{}; ok(false)},1500);
          });
          (async()=>{process.exit((await ping('/health'))||(await ping('/'))?0:1)})();"
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 2s
    networks:
      - proxy-network

  web:
    labels: *default-labels
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    image: caddy:2-alpine
    expose:
      - "80"
    environment:
      - API_PORT=${API_PORT}
      - VITE_PORT=${VITE_PORT}
      - TZ=America/Sao_Paulo
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./web/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      proxy-network:
        aliases:
          - weslei-bassotto-dev

volumes:
  react_node_modules:
  api_vendor:

networks:
  proxy-network:
    external: true
  postgres-network:
    external: true
    name: ${POSTGRES_NETWORK:-postgres-network}

# Lidos de arquivo, e não de variável: assim o valor do segredo nunca entra no
# ambiente do processo do Compose nem no mesmo arquivo da configuração comum.
# SECRETS_DIR vem do env de cada ambiente.
secrets:
  app_key:
    file: ${SECRETS_DIR}/app_key
  database_url:
    file: ${SECRETS_DIR}/database_url
  jwt_secret:
    file: ${SECRETS_DIR}/jwt_secret
  mercado_pago_access_token:
    file: ${SECRETS_DIR}/mercado_pago_access_token
  mercado_pago_webhook_secret:
    file: ${SECRETS_DIR}/mercado_pago_webhook_secret
  smtp_password:
    file: ${SECRETS_DIR}/smtp_password
