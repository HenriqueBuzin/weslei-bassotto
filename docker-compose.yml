services:
  api:
    profiles: ["prod"]
    restart: unless-stopped
    build:
      context: ./api
      args:
        API_PORT: ${API_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_BASE=${API_BASE}
      - APP_ENV=${APP_ENV}
      - DB_ADAPTER=${DB_ADAPTER}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE}
      - API_PORT=${API_PORT}
      - JWT_ALG=${JWT_ALG}
      - ACCESS_TOKEN_EXPIRES_MINUTES=${ACCESS_TOKEN_EXPIRES_MINUTES}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS}
      - LOGIN_ATTEMPT_WINDOW_MINUTES=${LOGIN_ATTEMPT_WINDOW_MINUTES}
      - LOGIN_LOCK_MINUTES=${LOGIN_LOCK_MINUTES}
      - REFRESH_TOKEN_EXPIRES_SHORT_HOURS=${REFRESH_TOKEN_EXPIRES_SHORT_HOURS}
      - REFRESH_TOKEN_EXPIRES_LONG_DAYS=${REFRESH_TOKEN_EXPIRES_LONG_DAYS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH}
      - SEED_ON_START=${SEED_ON_START}
      - PAYMENT_GATEWAY_ORDER=${PAYMENT_GATEWAY_ORDER}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL}
      - PASSWORD_RESET_EXPIRES_MINUTES=${PASSWORD_RESET_EXPIRES_MINUTES}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - SMTP_USE_SSL=${SMTP_USE_SSL}
      - SMTP_USER=${SMTP_USER}
      - SMTP_FROM=${SMTP_FROM}
      - DATABASE_URL_FILE=/run/secrets/database_url
      - MONGO_URI_FILE=/run/secrets/mongo_uri
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - ADMIN_EMAIL_FILE=/run/secrets/admin_email
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - ADMIN_ACCOUNTS_FILE=/run/secrets/admin_accounts
      - MERCADO_PAGO_ACCESS_TOKEN_FILE=/run/secrets/mercado_pago_access_token
      - MERCADO_PAGO_WEBHOOK_SECRET_FILE=/run/secrets/mercado_pago_webhook_secret
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
    secrets:
      - database_url
      - mongo_uri
      - jwt_secret
      - admin_email
      - admin_password
      - admin_accounts
      - mercado_pago_access_token
      - mercado_pago_webhook_secret
      - smtp_password
    ulimits:
      core:
        soft: 0
        hard: 0
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,urllib.request,json; p=os.getenv('API_PORT','8000'); j=json.loads(urllib.request.urlopen(f'http://localhost:{p}/health', timeout=2).read().decode()); sys.exit(0 if j.get('status')=='ok' else 1)\""]
      interval: 5s
      timeout: 2s
      retries: 40
      start_period: 5s
    networks:
      - proxy-network
      - postgres-network
      
  api_dev:
    profiles: ["dev"]
    restart: unless-stopped
    build:
      context: ./api
      args:
        API_PORT: ${API_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_BASE=${API_BASE}
      - APP_ENV=${APP_ENV}
      - DB_ADAPTER=${DB_ADAPTER}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE}
      - API_PORT=${API_PORT}
      - JWT_ALG=${JWT_ALG}
      - ACCESS_TOKEN_EXPIRES_MINUTES=${ACCESS_TOKEN_EXPIRES_MINUTES}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS}
      - LOGIN_ATTEMPT_WINDOW_MINUTES=${LOGIN_ATTEMPT_WINDOW_MINUTES}
      - LOGIN_LOCK_MINUTES=${LOGIN_LOCK_MINUTES}
      - REFRESH_TOKEN_EXPIRES_SHORT_HOURS=${REFRESH_TOKEN_EXPIRES_SHORT_HOURS}
      - REFRESH_TOKEN_EXPIRES_LONG_DAYS=${REFRESH_TOKEN_EXPIRES_LONG_DAYS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH}
      - SEED_ON_START=${SEED_ON_START}
      - PAYMENT_GATEWAY_ORDER=${PAYMENT_GATEWAY_ORDER}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL}
      - PASSWORD_RESET_EXPIRES_MINUTES=${PASSWORD_RESET_EXPIRES_MINUTES}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - SMTP_USE_SSL=${SMTP_USE_SSL}
      - SMTP_USER=${SMTP_USER}
      - SMTP_FROM=${SMTP_FROM}
      - DATABASE_URL_FILE=/run/secrets/database_url
      - MONGO_URI_FILE=/run/secrets/mongo_uri
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - ADMIN_EMAIL_FILE=/run/secrets/admin_email
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - ADMIN_ACCOUNTS_FILE=/run/secrets/admin_accounts
      - MERCADO_PAGO_ACCESS_TOKEN_FILE=/run/secrets/mercado_pago_access_token
      - MERCADO_PAGO_WEBHOOK_SECRET_FILE=/run/secrets/mercado_pago_webhook_secret
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
    secrets:
      - database_url
      - mongo_uri
      - jwt_secret
      - admin_email
      - admin_password
      - admin_accounts
      - mercado_pago_access_token
      - mercado_pago_webhook_secret
      - smtp_password
    ulimits:
      core:
        soft: 0
        hard: 0
    volumes:
      - ./api:/app
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT} --reload"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,urllib.request,json; p=os.getenv('API_PORT','8000'); j=json.loads(urllib.request.urlopen(f'http://localhost:{p}/health', timeout=2).read().decode()); sys.exit(0 if j.get('status')=='ok' else 1)\""]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 2s
    networks:
      - proxy-network
      - postgres-network

  frontend:
    profiles: ["dev"]
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_PORT=${VITE_PORT}
    environment:
      - VITE_API_BASE=${VITE_API_BASE}
      - VITE_PORT=${VITE_PORT}
      - VITE_APP_NAME=${VITE_APP_NAME}
      - VITE_MP_TRIMESTRAL_URL=${VITE_MP_TRIMESTRAL_URL}
      - VITE_MP_SEMESTRAL_URL=${VITE_MP_SEMESTRAL_URL}
      - VITE_MP_ANUAL_URL=${VITE_MP_ANUAL_URL}
      - VITE_MP_PUBLIC_KEY=${VITE_MP_PUBLIC_KEY}
      - VITE_WHATSAPP_NUMBER=${VITE_WHATSAPP_NUMBER}
      - VITE_PROXY_TARGET=http://api_dev:8000
      - VITE_HMR_DISABLED=${VITE_HMR_DISABLED}
      - VITE_HMR_HOST=${VITE_HMR_HOST}
      - VITE_HMR_PROTOCOL=${VITE_HMR_PROTOCOL}
      - VITE_HMR_CLIENT_PORT=${VITE_HMR_CLIENT_PORT}
      - VITE_HMR_PATH=${VITE_HMR_PATH}
    volumes:
      - ./frontend:/app
      - react_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - |
          : "$${VITE_PORT:?VITE_PORT nao definido}";
          node -e "
          const http=require('http'), p=Number(process.env.VITE_PORT);
          const ping=path=>new Promise(ok=>{
            const r=http.get({host:'127.0.0.1',port:p,path},s=>ok(s.statusCode===200));
            r.on('error',()=>ok(false)); setTimeout(()=>{try{r.destroy()}catch{}; ok(false)},1500);
          });
          (async()=>{process.exit((await ping('/health'))||(await ping('/'))?0:1)})();"
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 2s
    networks:
      - proxy-network

  caddy:
    profiles: ["dev"]
    restart: unless-stopped
    image: caddy:2-alpine
    expose:
      - "80"
    environment:
      - API_PORT=${API_PORT}
      - VITE_PORT=${VITE_PORT}
    depends_on:
      api_dev:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./web/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      proxy-network:
        aliases:
          - weslei-bassotto-dev

  web:
    profiles: ["prod"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        - VITE_API_BASE=${VITE_API_BASE}
        - VITE_APP_NAME=${VITE_APP_NAME}
        - VITE_MP_TRIMESTRAL_URL=${VITE_MP_TRIMESTRAL_URL}
        - VITE_MP_SEMESTRAL_URL=${VITE_MP_SEMESTRAL_URL}
        - VITE_MP_ANUAL_URL=${VITE_MP_ANUAL_URL}
        - VITE_MP_PUBLIC_KEY=${VITE_MP_PUBLIC_KEY}
        - VITE_WHATSAPP_NUMBER=${VITE_WHATSAPP_NUMBER}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_PORT=${API_PORT}
      - CADDY_DOMAIN=${CADDY_DOMAIN}
      - CADDY_EMAIL=${CADDY_EMAIL}
    networks:
      proxy-network:
        aliases:
          - weslei-bassotto

volumes:
  react_node_modules:
    name: ${COMPOSE_PROJECT_NAME}_react_node_modules
    
networks:
  proxy-network:
    external: true
  postgres-network:
    external: true
    name: ${POSTGRES_NETWORK:-postgres-network}

secrets:
  database_url:
    environment: DATABASE_URL
  mongo_uri:
    environment: MONGO_URI
  jwt_secret:
    environment: JWT_SECRET
  admin_email:
    environment: ADMIN_EMAIL
  admin_password:
    environment: ADMIN_PASSWORD
  admin_accounts:
    environment: ADMIN_ACCOUNTS
  mercado_pago_access_token:
    environment: MERCADO_PAGO_ACCESS_TOKEN
  mercado_pago_webhook_secret:
    environment: MERCADO_PAGO_WEBHOOK_SECRET
  smtp_password:
    environment: SMTP_PASSWORD
