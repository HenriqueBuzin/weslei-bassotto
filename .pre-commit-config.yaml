repos:
  - repo: local
    hooks:
      # Pint is the PHP counterpart of black + isort: one formatter, no debate.
      - id: pint
        name: pint api
        entry: python scripts/pint.py
        language: system
        types: [php]
        pass_filenames: false

      - id: prettier
        name: prettier frontend
        entry: npm --prefix frontend run format
        language: system
        pass_filenames: false
        always_run: true

      - id: eslint
        name: eslint frontend
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        always_run: true

      # Covers what flake8 and pytest used to: phpstan for static analysis and
      # phpunit with the 100% line floor, plus every frontend gate.
      - id: quality-gates
        name: full quality gates
        entry: python scripts/validate.py
        language: system
        pass_filenames: false
        always_run: true
