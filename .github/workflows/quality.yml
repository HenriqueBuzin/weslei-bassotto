name: Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - tests and 100% coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e ".[test]"
      - name: Enforce 100% statements, lines and branches
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=100 -q
      - name: Unit tests
        run: python -m pytest -m unit -q
      - name: Integration tests
        run: python -m pytest -m integration -q
      - name: API tests
        run: python -m pytest -m api -q
      - name: Functional tests
        run: python -m pytest -m functional -q
      - name: Regression tests
        run: python -m pytest -m regression -q
      - name: Smoke tests
        run: python -m pytest -m smoke -q

  frontend:
    name: Frontend - tests and 100% coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Enforce 100% statements, lines, branches and functions
        run: npm run test:coverage
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: API tests
        run: npm run test:api
      - name: Functional tests
        run: npm run test:functional
      - name: Regression tests
        run: npm run test:regression
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build

  e2e:
    name: E2E - desktop and mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
