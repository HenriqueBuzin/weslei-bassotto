name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Infrastructure - Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose-prod.yml config --quiet
      - name: Container
        run: docker build --build-arg API_PORT=8000 --tag weslei-bassotto-backend:ci api
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: weslei-bassotto-backend:ci
          artifact-name: weslei-bassotto-backend.spdx.json
      - name: Scan container
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: weslei-bassotto-backend:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - name: Deploy
        run: echo "Deploy autorizado apenas pelo Jenkins em main/dev."

  backend:
    name: Backend - tests and 100% coverage
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        run: |
          python -m pip install poetry==2.4.1
          poetry config virtualenvs.create false
          poetry install
      - name: Black
        run: poetry run black --check .
      - name: isort
        run: poetry run isort --check-only .
      - name: Flake8
        run: poetry run flake8 .
      - name: Verify
        run: poetry run pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=100 -q
      - name: Unit tests
        run: poetry run pytest -m unit -q
      - name: Integration tests
        run: poetry run pytest -m integration -q
      - name: API tests
        run: poetry run pytest -m api -q
      - name: Functional tests
        run: poetry run pytest -m functional -q
      - name: Regression tests
        run: poetry run pytest -m regression -q
      - name: Smoke tests
        run: poetry run pytest -m smoke -q

  frontend:
    name: Frontend - tests and 100% coverage
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE: /api/v1
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Enforce 100% statements, lines, branches and functions
        run: npm run test:coverage
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: API tests
        run: npm run test:api
      - name: Functional tests
        run: npm run test:functional
      - name: Regression tests
        run: npm run test:regression
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build

  e2e:
    name: E2E - desktop and mobile
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
