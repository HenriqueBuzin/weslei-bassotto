name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Infrastructure - Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate production and development profiles
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
      - name: Build backend container
        run: docker build --build-arg API_PORT=8000 --tag weslei-bassotto-backend:ci api
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: weslei-bassotto-backend:ci
          artifact-name: weslei-bassotto-backend.spdx.json
      - name: Scan container
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: weslei-bassotto-backend:ci
          fail-build: true
          severity-cutoff: high

  backend:
    name: Backend - tests and 100% coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install poetry==2.4.1
          poetry config virtualenvs.create false
          poetry install
      - name: Black
        run: poetry run black --check .
      - name: isort
        run: poetry run isort --check-only .
      - name: Flake8
        run: poetry run flake8 .
      - name: Enforce 100% statements, lines and branches
        run: poetry run pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=100 -q
      - name: Unit tests
        run: poetry run pytest -m unit -q
      - name: Integration tests
        run: poetry run pytest -m integration -q
      - name: API tests
        run: poetry run pytest -m api -q
      - name: Functional tests
        run: poetry run pytest -m functional -q
      - name: Regression tests
        run: poetry run pytest -m regression -q
      - name: Smoke tests
        run: poetry run pytest -m smoke -q

  frontend:
    name: Frontend - tests and 100% coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Enforce 100% statements, lines, branches and functions
        run: npm run test:coverage
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: API tests
        run: npm run test:api
      - name: Functional tests
        run: npm run test:functional
      - name: Regression tests
        run: npm run test:regression
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build

  e2e:
    name: E2E - desktop and mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
