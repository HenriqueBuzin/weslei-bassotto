[project]
name = "myapi"
version = "0.1.0"
description = "FastAPI + Postgres API"
authors = []
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.51.0",
  "pydantic[email]==2.13.4",
  "pydantic-settings==2.14.2",
  "asyncpg==0.31.0",
  "motor==3.7.1",
  "python-jose[cryptography]==3.5.0",
  "passlib[argon2]==1.7.4",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
pytest-cov = "7.1.0"
mongomock-motor = "0.0.36"
black = "26.5.1"
isort = "8.0.1"
flake8 = "7.3.0"
pre-commit = "4.6.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: testes unitarios isolados",
  "integration: integracao entre servicos, banco e rotas",
  "api: contrato HTTP da API",
  "functional: regras funcionais completas",
  "regression: cenarios de regressao",
  "smoke: verificacoes rapidas de saude",
]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
